[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunco2pro"
version = "0.2.0"
description = "TunCO2 Pro - embodied carbon and low-carbon lining design for TBM tunnels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Qianbing Zhang", email = "qianbing.zhang@monash.edu" }]
maintainers = [{ name = "Qianbing Zhang", email = "qianbing.zhang@monash.edu" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.5",
  "pymoo>=0.6.1",
  "trimesh>=4.0",
  "openpyxl>=3.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8"]
rhino = ["rhino3dm>=8.0"]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "sympy>=1.12"]
all = ["tunco2pro[ifc,rhino,figures,dev]"]

[project.urls]
Homepage = "https://github.com/qbzhang666/TunCO2-Pro"
Repository = "https://github.com/qbzhang666/TunCO2-Pro"
"Original TunCO2" = "https://github.com/X-Chen1997/TunCO2"

[project.scripts]
tunco2pro = "tunco2pro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tunco2pro = ["data/*.csv", "data/*.json", "data/fonts/*", "data/examples/*/*", "web/*", "web/vendor/*", "web/vendor/leaflet/*", "web/vendor/leaflet/images/*", "web/assets/tbm/*", "integrations/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"  # no .pytest_cache in the (Dropbox) project folder
pythonpath = ["tests"]
